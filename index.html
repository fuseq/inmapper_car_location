<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aracım Nerede?</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Harita Container -->
    <div id="map"></div>

    <!-- Expand Button (Bottom Sheet Dışında) -->
    <button id="expandBtn" class="expand-btn-external">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
        </svg>
    </button>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h1>🚗 Aracım Nerede?</h1>
        </div>

        <!-- Bottom Sheet -->
        <div id="bottomSheet" class="bottom-sheet">
            <!-- Drag Handle -->
            <div class="bottom-sheet-handle"></div>

            <div class="bottom-sheet-content">
                <!-- Arama Kutusu -->
                <div class="search-box">
                    <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Nereyi arıyorsun?">
                </div>

                <!-- Kategori Grid -->
                <div class="category-grid">
                    <div class="category-item">
                        <div class="category-icon">🛒</div>
                        <div class="category-name">Alışveriş</div>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">🍽️</div>
                        <div class="category-name">Yemek</div>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">❓</div>
                        <div class="category-name">Diğer</div>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">🚻</div>
                        <div class="category-name">Tuvalet</div>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">🚪</div>
                        <div class="category-name">Giriş</div>
                    </div>
                    <div class="category-item">
                        <div class="category-icon">🏧</div>
                        <div class="category-name">ATM</div>
                    </div>
                </div>

                <!-- Araç Kayıt İçeriği -->
                <div id="carContent" class="car-content">
                    <!-- Kayıtlı Araçlar -->
                    <div id="carSaved" class="car-section hidden">
                        <div class="cupertino-pane saved-cars-pane">
                            <button id="addNewCarBtn" class="btn-add-new" title="Yeni Kayıt Ekle">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                <span>Ekle</span>
                            </button>
                            <div class="picker-header">
                                <span class="note-header">Kayıtlı Araçlar</span>
                            </div>
                            <div id="savedCarsList" class="saved-cars-scroll"></div>
                        </div>
                    </div>

                    <!-- Kayıt Formu -->
                    <div id="noCarSaved" class="car-section">
                        <div class="section-header-with-cancel">
                            <h3>Araç Park Yeri Kaydet</h3>
                            <button id="cancelFormBtn" class="btn-cancel" title="İptal">İptal</button>
                        </div>

                        <!-- iOS Picker -->
                        <div class="cupertino-pane">
                            <div class="picker-header">
                                <span id="result-display">Park Yeri Seç</span>
                            </div>

                            <div class="picker-container">
                                <!-- Park Yeri Picker (Sol) -->
                                <div class="parking-picker-wrapper">
                                    <div class="picker-labels">
                                        <span>Kat</span>
                                        <span>Sütun</span>
                                        <span>Numara</span>
                                    </div>
                                    
                                    <div class="date-picker">
                                        <div class="highlight-bar"></div>
                                        
                                        <!-- Kat (Normal - Finite) -->
                                        <div class="column" id="col-floor">
                                            <div class="column-content" id="content-floor"></div>
                                        </div>
                                        
                                        <!-- Sütun (Infinite) -->
                                        <div class="column" id="col-column">
                                            <div class="column-content" id="content-column"></div>
                                        </div>
                                        
                                        <!-- Numara (Infinite) -->
                                        <div class="column" id="col-number">
                                            <div class="column-content" id="content-number"></div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <!-- Not Kartı -->
                        <div class="cupertino-pane note-photo-pane">
                            <div class="note-container">
                                <textarea id="parkingNote" class="note-textarea" placeholder="Not ve/veya resim ekle (Opsiyonel)"></textarea>
                                <button type="button" id="cameraBtn" class="camera-btn" title="Resim Ekle">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                        <circle cx="12" cy="13" r="4"/>
                                    </svg>
                                </button>
                                <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;">
                            </div>
                        </div>

                        <button id="saveParkingBtn" class="btn-save">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                                <polyline points="7 3 7 8 15 8"/>
                            </svg>
                            Kaydet
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Spotlight Overlay -->
    <div id="spotlight-overlay"></div>

    <!-- Tour Bubble -->
    <div id="tour-bubble">
        <h3>🚗 Araç Kaydı</h3>
        <p>Aracınızın park yerini kaydetmek için bu butona tıklayın.</p>
        <button class="btn-tour-close" onclick="window.carLocationApp.closeTour()">Anladım!</button>
    </div>

    <!-- Photo Modal -->
    <div id="photoModal" class="photo-modal">
        <div class="photo-modal-overlay"></div>
        <div class="photo-modal-content">
            <button class="photo-modal-close">&times;</button>
            <img id="photoModalImage" src="" alt="Park Yeri Fotoğrafı">
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
